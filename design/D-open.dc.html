<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>색 한 장 — 열린 편지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
a:focus-visible,button:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:{{tint}};color:#FFFFFF;font-family:'Noto Sans KR',sans-serif;padding:32px 28px 28px;display:flex;flex-direction:column;overflow:hidden">
  <p style="margin:0;font-size:16px;font-weight:500;line-height:1.5">영진이 지민에게 쓴 편지</p>

  <div style="flex-grow:1;position:relative">
    <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:6px;pointer-events:none">
      <span style="align-self:flex-start;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:44px;line-height:1;letter-spacing:-1px;transform:{{p1}};opacity:{{po}};transition:transform 1s cubic-bezier(0.3,0.1,0.2,1),opacity 1s">2027</span>
      <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:216px;line-height:0.82;letter-spacing:-10px;margin-left:-8px;display:flex"><span style="display:inline-block;transform:{{p2}};opacity:{{po}};transition:transform 1s cubic-bezier(0.3,0.1,0.2,1),opacity 1s">1</span><span style="display:inline-block;transform:{{p3}};opacity:{{po}};transition:transform 1.1s cubic-bezier(0.3,0.1,0.2,1),opacity 1.1s">.</span><span style="display:inline-block;transform:{{p4}};opacity:{{po}};transition:transform 0.9s cubic-bezier(0.3,0.1,0.2,1),opacity 0.9s">1</span></span>
      <span style="align-self:flex-start;margin-top:18px;font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1.3;transform:{{p5}};opacity:{{po}};transition:transform 1s cubic-bezier(0.3,0.1,0.2,1),opacity 1s">0시에 열립니다</span>
      <span style="align-self:flex-start;margin-top:6px;font-size:15px;line-height:1.65;max-width:300px;transform:{{p6}};opacity:{{po}};transition:transform 1.1s cubic-bezier(0.3,0.1,0.2,1),opacity 1.1s">그 전에는 쓴 사람도, 이 사이트도 열 수 없습니다.</span>
    </div>

    <div style="position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;opacity:{{lo}};transform:{{lt}};transition:opacity 0.8s ease 0.55s,transform 0.8s ease 0.55s">
      <p style="margin:0;font-size:20px;font-weight:500;line-height:1.85;white-space:pre-line">지민아, 이걸 쓰는 지금은 11월이야.
너는 이직할지 말지 아직 고민 중이고, 나는 네가 결국 옮길 거라는 데 만 원 걸었어.
맞았으면 오늘 밥은 네가 사.
틀렸으면, 그것도 잘한 결정이었을 거야.
새해 복 많이 받아.</p>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #FFFFFF;padding-top:14px">
      <span style="font-size:15px;font-weight:500">열린 시각</span>
      <span style="font-size:22px;font-weight:900;letter-spacing:-0.5px">2027. 1. 1. 0:00</span>
    </div>
    <a href="Main.dc.html" style="height:58px;border-radius:29px;background:#FFFFFF;color:{{tint}};font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none">답장도 잠가서 보내기</a>
    <button onClick="{{replay}}" style="height:48px;border:0;background:transparent;color:#FFFFFF;font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:500;text-decoration:underline;text-underline-offset:4px;cursor:pointer">다시 보기</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tint":{"editor":"color","default":"#0A7A43","options":["#0A7A43","#C2362B","#1D45C8","#1B1B1B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: false };
    this.timer = null;
  }
  componentDidMount() {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { this.setState({ open: true }); return; }
    this.play();
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  play() {
    clearTimeout(this.timer);
    this.setState({ open: false });
    this.timer = setTimeout(() => this.setState({ open: true }), 1100);
  }
  renderVals() {
    var o = this.state.open;
    return {
      tint: this.props.tint ?? '#0A7A43',
      po: o ? '0' : '1',
      p1: o ? 'translate(-180px,-280px) rotate(-40deg)' : 'none',
      p2: o ? 'translate(-280px,140px) rotate(-70deg)' : 'none',
      p3: o ? 'translate(0,-460px) rotate(180deg)' : 'none',
      p4: o ? 'translate(300px,-90px) rotate(60deg)' : 'none',
      p5: o ? 'translate(260px,340px) rotate(25deg)' : 'none',
      p6: o ? 'translate(-280px,380px) rotate(-18deg)' : 'none',
      lo: o ? '1' : '0',
      lt: o ? 'none' : 'scale(0.94)',
      replay: () => this.play()
    };
  }
}
</script>
</body>
</html>
