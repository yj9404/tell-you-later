<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>좋은 하루 짤 — 열린 편지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&amp;family=Noto+Sans+KR:wght@500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
a:focus-visible,button:focus-visible{outline:4px solid #000000;outline-offset:2px}
@keyframes mFallA{0%{transform:translate(0,0) rotate(0deg)}100%{transform:translate(-70px,980px) rotate(560deg)}}
@keyframes mFallB{0%{transform:translate(0,0) rotate(0deg)}100%{transform:translate(-70px,980px) rotate(560deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:linear-gradient(180deg,#58B8FF 0%,#BFE8FF 48%,#FFD9EC 100%);color:#000000;font-family:'Noto Sans KR',sans-serif;padding:26px 20px 24px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position:absolute;left:0;top:0;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.2))">
    <defs>
      <path id="moPA" d="M0 0 C-15 -9 -19 -34 -7 -47 C-4 -44 -2 -43 0 -41 C3 -44 5 -45 8 -47 C19 -33 14 -10 0 0 Z"></path>
      <path id="moPB" d="M0 0 C-12 -12 -17 -30 -4 -44 C2 -50 10 -44 13 -36 C17 -24 10 -8 0 0 Z"></path>
      <g id="moLeaf"><path d="M0 0 C14 -17 42 -19 60 -4 C42 11 14 12 0 0 Z" fill="#1E8E3E"></path></g>
      <g id="moFlower">
        <g fill="currentColor">
          <use href="#moPA"></use>
          <use href="#moPB" transform="rotate(52) scale(0.92)"></use>
          <use href="#moPA" transform="rotate(101)"></use>
          <use href="#moPB" transform="rotate(158) scale(1.06)"></use>
          <use href="#moPA" transform="rotate(205) scale(0.9)"></use>
          <use href="#moPB" transform="rotate(259)"></use>
          <use href="#moPA" transform="rotate(311) scale(1.04)"></use>
        </g>
        <circle r="9" fill="#FFD400"></circle>
      </g>
    </defs>
    <use href="#moLeaf" transform="translate(40 58) rotate(38) scale(1.3)"></use>
    <use href="#moFlower" style="color:#FF3B7F" transform="translate(32 38) rotate(12) scale(1.4)"></use>
    <use href="#moFlower" style="color:#FFB7D2" transform="translate(98 16) rotate(-30) scale(0.78)"></use>
    <use href="#moLeaf" transform="translate(352 236) rotate(150) scale(1.15)"></use>
    <use href="#moFlower" style="color:#FFFFFF" transform="translate(372 196) rotate(-18) scale(1.22)"></use>
    <use href="#moFlower" style="color:#B14DFF" transform="translate(8 640) rotate(25) scale(1.1)"></use>
  </svg>

  <p style="margin:0;text-align:center;font-family:'Nanum Brush Script',cursive;font-size:44px;line-height:1.1;color:#C4004F;text-shadow:2px 0 #FFFFFF,-2px 0 #FFFFFF,0 2px #FFFFFF,0 -2px #FFFFFF,2px 2px #FFFFFF,-2px -2px #FFFFFF,2px -2px #FFFFFF,-2px 2px #FFFFFF;position:relative">지민 님</p>

  <div style="flex-grow:1;position:relative">
    <div aria-hidden="{{lockedHidden}}" style="position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;gap:16px;justify-content:center;opacity:{{lockedO}};transform:{{lockedT}};transition:opacity 0.6s,transform 0.6s">
      <span style="text-align:center;font-family:'Nanum Brush Script',cursive;font-size:92px;line-height:1;text-shadow:3px 0 #FFFFFF,-3px 0 #FFFFFF,0 3px #FFFFFF,0 -3px #FFFFFF,3px 3px #FFFFFF,-3px -3px #FFFFFF,3px -3px #FFFFFF,-3px 3px #FFFFFF,5px 6px 0 rgba(0,0,0,0.25)"><span style="color:#E3001B">오늘도</span><br><span style="color:#0A3FD6">좋은 하루</span><br><span style="color:#0A7A2F">되세요</span></span>
      <div style="background:#FFF200;border:4px solid #E3001B;padding:12px 10px;text-align:center;font-size:19px;font-weight:900;line-height:1.5">드디어 1월 1일 0시입니다</div>
    </div>

    <div aria-hidden="{{openHidden}}" style="position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:12px;opacity:{{openO}};transform:{{openT}};transition:opacity 0.8s ease 0.5s,transform 0.8s ease 0.5s">
      <h1 style="margin:0;text-align:center;font-family:'Nanum Brush Script',cursive;font-weight:400;font-size:54px;line-height:1.05;color:#E3001B;text-shadow:3px 0 #FFFFFF,-3px 0 #FFFFFF,0 3px #FFFFFF,0 -3px #FFFFFF,3px 3px #FFFFFF,-3px -3px #FFFFFF,3px -3px #FFFFFF,-3px 3px #FFFFFF">편지가 열렸습니다</h1>
      <div style="background:#FFFFFF;border:4px solid #E3001B;padding:16px 16px 12px;display:flex;flex-direction:column;gap:8px">
        <p style="margin:0;font-size:18px;font-weight:700;line-height:1.75;white-space:pre-line">지민아, 이걸 쓰는 지금은 11월이야.
너는 이직할지 말지 아직 고민 중이고, 나는 네가 결국 옮길 거라는 데 만 원 걸었어.
맞았으면 오늘 밥은 네가 사.
틀렸으면, 그것도 잘한 결정이었을 거야.
새해 복 많이 받아.</p>
        <span style="text-align:right;font-family:'Nanum Brush Script',cursive;font-size:36px;line-height:1;color:#0A3FD6">영진 드림</span>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px;position:relative">
    <a href="Main.dc.html" style="height:64px;border-radius:10px;background:#C4001A;border:3px solid #FFFFFF;box-shadow:0 4px 0 #7A0010;color:#FFFFFF;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;text-decoration:none">답장 보내기</a>
    <button onClick="{{replay}}" style="height:58px;border:3px solid #0A3FD6;border-radius:10px;background:#FFFFFF;color:#0A3FD6;font-family:'Noto Sans KR',sans-serif;font-size:20px;font-weight:900;cursor:pointer">다시 보기</button>
  </div>

  <sc-for list="{{petals}}" as="p" hint-placeholder-count="0">
    <svg aria-hidden="true" width="{{p.size}}" height="{{p.size}}" viewBox="-20 -50 40 52" style="position:absolute;top:-70px;left:{{p.left}};color:{{p.color}};animation:{{p.anim}};pointer-events:none"><path d="M0 0 C-15 -9 -19 -34 -7 -47 C-4 -44 -2 -43 0 -41 C3 -44 5 -45 8 -47 C19 -33 14 -10 0 0 Z" fill="currentColor"></path></svg>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var M_PETALS = [
  { left: '4%', delay: 0, dur: 2.3, size: 34, color: '#FF3B7F' },
  { left: '16%', delay: 0.35, dur: 2.7, size: 26, color: '#FFFFFF' },
  { left: '27%', delay: 0.1, dur: 2.1, size: 40, color: '#FFB7D2' },
  { left: '38%', delay: 0.6, dur: 2.6, size: 28, color: '#B14DFF' },
  { left: '47%', delay: 0.2, dur: 2.4, size: 36, color: '#FF3B7F' },
  { left: '56%', delay: 0.75, dur: 2.2, size: 24, color: '#FFB300' },
  { left: '66%', delay: 0.05, dur: 2.8, size: 38, color: '#FFFFFF' },
  { left: '75%', delay: 0.45, dur: 2.3, size: 30, color: '#FF6FA5' },
  { left: '85%', delay: 0.25, dur: 2.5, size: 42, color: '#E3001B' },
  { left: '94%', delay: 0.65, dur: 2.1, size: 26, color: '#FFB7D2' },
  { left: '104%', delay: 0.15, dur: 2.6, size: 34, color: '#B14DFF' },
  { left: '112%', delay: 0.5, dur: 2.4, size: 30, color: '#FF3B7F' }
];
M_PETALS = (function () {
  var colors = ['#FF3B7F', '#FFFFFF', '#FFB7D2', '#B14DFF', '#FF6FA5', '#FFB300', '#E3001B'];
  var out = [];
  for (var i = 0; i < 40; i++) {
    out.push({
      left: (((i * 37) % 122) - 6) + '%',
      delay: ((i * 53) % 220) / 100,
      dur: 2 + ((i * 29) % 100) / 100,
      size: 20 + ((i * 17) % 26),
      color: colors[i % colors.length]
    });
  }
  return out;
})();
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: false, run: 0, still: false };
    this.timer = null;
  }
  componentDidMount() {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { this.setState({ open: true, still: true }); return; }
    this.play();
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  play() {
    clearTimeout(this.timer);
    this.setState({ open: false });
    this.timer = setTimeout(() => this.setState({ open: true, run: this.state.run + 1 }), 1200);
  }
  renderVals() {
    var s = this.state;
    var name = s.run % 2 === 0 ? 'mFallA' : 'mFallB';
    var fly = s.open && !s.still;
    return {
      lockedO: s.open ? '0' : '1',
      lockedT: s.open ? 'scale(1.08)' : 'none',
      lockedHidden: s.open ? 'true' : 'false',
      openO: s.open ? '1' : '0',
      openT: s.open ? 'none' : 'translateY(16px)',
      openHidden: s.open ? 'false' : 'true',
      petals: M_PETALS.map(function (p) {
        return { left: p.left, size: p.size, color: p.color, anim: fly ? (name + ' ' + p.dur + 's ease-in ' + p.delay + 's both') : 'none' };
      }),
      replay: () => this.play()
    };
  }
}
</script>
</body>
</html>
