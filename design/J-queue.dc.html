<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>대기열 — 아직 잠긴 편지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.col>*{flex-shrink:0}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
@keyframes jspin{to{transform:rotate(360deg)}}
@keyframes jIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div class="col" style="width:390px;height:844px;box-sizing:border-box;background:#F2F3F5;color:#191B1F;font-family:'Noto Sans KR',sans-serif;padding:18px 18px 24px;display:flex;flex-direction:column;gap:14px">
  <div style="display:flex;justify-content:space-between;align-items:center;height:32px;padding:0 4px;font-size:13px;color:#6B7280">
    <span style="font-weight:700;color:#191B1F">예약 편지 입장</span><span>영진 → 지민</span>
  </div>
  <div style="flex-grow:1;flex-shrink:1;background:#FFFFFF;border-radius:20px;padding:26px 22px 20px;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#2F54EB"><span aria-hidden="true" style="width:14px;height:14px;box-sizing:border-box;border-radius:50%;border:2px solid #D6DBF5;border-top-color:#2F54EB;animation:jspin .9s linear infinite"></span><span>접속 대기 중</span></div>
    <h1 style="margin:12px 0 0;font-size:22px;font-weight:700;letter-spacing:-0.6px;line-height:1.45">할 말이 있는데<br>1월 1일에 할게</h1>
    <span style="margin-top:28px;font-size:14px;color:#6B7280">나의 대기순서</span>
    <div style="display:flex;align-items:baseline;gap:6px;margin-top:2px"><span class="num" style="font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1.15">4,363,240</span><span style="font-size:18px;font-weight:600">번째</span></div>
    <div role="img" aria-label="대기 진행률" style="margin-top:14px;height:6px;border-radius:3px;background:#EEF0F3;overflow:hidden"><div style="height:100%;width:1%;min-width:6px;border-radius:3px;background:#2F54EB;"></div></div>
    <div style="margin-top:20px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid #EEF0F3;font-size:14px"><span style="color:#6B7280">입장 시각</span><span class="num" style="font-weight:600;color:#191B1F">2027년 1월 1일 오전 0:00</span></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid #EEF0F3;font-size:14px"><span style="color:#6B7280">남은 시간</span><span class="num" style="font-weight:600;color:#191B1F">50일 12시간 54분</span></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid #EEF0F3;font-size:14px"><span style="color:#6B7280">먼저 입장</span><span class="num" style="font-weight:600;color:#191B1F">누구도 할 수 없어요</span></div>
    </div>
    <div style="margin-top:auto;border-radius:12px;background:#F6F7F9;padding:14px 16px;font-size:13px;line-height:1.75;color:#4B5563">대기순서는 1초에 한 번씩 줄어요.<br>창을 닫았다가 다시 와도 순서는 그대로예요.</div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button  style="height:54px;border:1px solid #D1D5DB;border-radius:12px;background:#FFFFFF;color:#191B1F;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer">캘린더에 저장</button><a href="Main.dc.html" style="height:54px;border-radius:12px;background:#2F54EB;color:#FFFFFF;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none">나도 줄 세우기</a></div>
</div>
</x-dc>

</html>
