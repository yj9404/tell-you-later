<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가려진 글 — 열린 편지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;500;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.col>*{flex-shrink:0}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
.sans{font-family:"Noto Sans KR",sans-serif}
</style>
</helmet>
<div class="col" style="width:390px;height:844px;box-sizing:border-box;background:#DCDDD9;color:#141414;font-family:'Hahmlet',serif;padding:26px 20px 24px;display:flex;flex-direction:column;gap:18px">
  <div style="position:relative;flex-grow:1;flex-shrink:1;min-height:0;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 30px rgba(0,0,0,.08);padding:22px 22px 18px;display:flex;flex-direction:column;overflow:hidden">
    <div class="sans" style="display:flex;justify-content:space-between;font-size:11.5px;color:#6B6B6B;padding-bottom:10px;border-bottom:1px solid #141414"><span>편지 문서</span><span>공개됨 2027. 1. 1. 00:00</span></div>
    <h1 style="margin:16px 0 4px;font-size:21px;font-weight:700;letter-spacing:-0.5px;line-height:1.4">할 말이 있는데<br>1월 1일에 할게</h1>
    <div class="sans" style="font-size:12px;color:#6B6B6B;margin-bottom:22px">작성 영진 / 수신 지민</div>
    <div aria-hidden="true" class="sans" style="position:absolute;right:18px;top:96px;transform:rotate(-9deg);border:2.5px solid #C8322B;color:#C8322B;border-radius:6px;padding:6px 12px;font-size:17px;font-weight:700;letter-spacing:2px;opacity:{{s1}};mix-blend-mode:multiply;transition:opacity .4s, transform .4s">공개 전</div><div aria-hidden="true" class="sans" style="position:absolute;right:18px;top:96px;transform:rotate(-9deg);border:2.5px solid #1F4FB8;color:#1F4FB8;border-radius:6px;padding:6px 12px;font-size:17px;font-weight:700;letter-spacing:2px;opacity:{{s2}};mix-blend-mode:multiply;transition:opacity .4s .1s">공개됨</div>
    <div style="flex-grow:1;min-height:0;overflow-y:auto"><div style="display:flex;flex-wrap:wrap;align-content:flex-start;gap:9px 6px">
      <sc-for list="{{words}}" as="w" hint-placeholder-count="20"><span style="flex-basis:{{w.basis}};position:relative;font-size:17px;line-height:1.45;padding:0 1px"><span style="color:{{w.color}};transition:color .3s ease">{{w.text}}</span><span aria-hidden="true" style="position:absolute;left:0;top:2px;bottom:2px;background:#141414;border-radius:1.5px;width:{{w.cover}};transition:width .35s cubic-bezier(.6,0,.4,1)"></span></span></sc-for>
    </div></div>
  </div>
  <div class="sans" style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:13px;color:#4A4A4A">2026년 11월 11일에 씀</span><sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><button onClick="{{showAll}}" style="border:0;background:transparent;padding:0;font-family:inherit;font-size:14px;text-decoration:underline;text-underline-offset:4px;cursor:pointer">한 번에 보기</button></sc-if></div>
  <div class="sans" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button onClick="{{replay}}" style="height:52px;border:1px solid #9A9A95;border-radius:4px;background:transparent;color:#141414;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer">다시 보기</button><a href="Main.dc.html" style="height:52px;border-radius:4px;background:#141414;color:#FFFFFF;font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;text-decoration:none">답장도 잠가서 보내기</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
var E_LINES = ["지민아, 이걸 쓰는 지금은 11월이야.", "너는 이직할지 말지 아직 고민 중이고, 나는 네가 결국 옮길 거라는 데 만 원 걸었어.", "맞았으면 오늘 밥은 네가 사.", "틀렸으면, 그것도 잘한 결정이었을 거야.", "새해 복 많이 받아."];
var E_WORDS = [];
E_LINES.forEach(function (line, li) {
  line.split(' ').forEach(function (t) { E_WORDS.push({ text: t, br: false }); });
  if (li < E_LINES.length - 1) E_WORDS.push({ text: '', br: true });
});
var E_COUNT = E_WORDS.filter(function (w) { return !w.br; }).length;
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { shown: 0 }; this.timer = null; }
  componentDidMount() {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { this.setState({ shown: E_COUNT }); return; }
    this.play();
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  play() { clearTimeout(this.timer); this.setState({ shown: 0 }); this.timer = setTimeout(() => this.step(), 900); }
  step() { var n = this.state.shown + 1; this.setState({ shown: n }); if (n < E_COUNT) this.timer = setTimeout(() => this.step(), 120); }
  renderVals() {
    var n = this.state.shown, k = 0;
    var words = E_WORDS.map(function (w) {
      if (w.br) return { text: '', basis: '100%', color: 'transparent', cover: '0%' };
      var open = k < n; k += 1;
      return { text: w.text, basis: 'auto', color: open ? '#141414' : 'transparent', cover: open ? '0%' : '100%' };
    });
    var done = n >= E_COUNT;
    return { words: words, playing: !done, s1: n > 0 ? '0' : '1', s2: done ? '1' : '0',
      showAll: () => { clearTimeout(this.timer); this.setState({ shown: E_COUNT }); }, replay: () => this.play() };
  }
}
</script>
</body>
</html>
