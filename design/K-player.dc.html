<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>플레이어 — 아직 잠긴 편지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
a:focus-visible,button:focus-visible{outline:2px solid #FFFFFF;outline-offset:3px}
@keyframes kspin{to{transform:rotate(360deg)}}
.k-grooves{background:repeating-radial-gradient(circle at center,#151515 0 1.6px,#1F1F1F 1.6px 2.6px)}
.k-sheen{background:conic-gradient(from 20deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.16) 25deg,rgba(255,255,255,0) 55deg,rgba(255,255,255,0) 180deg,rgba(255,255,255,.12) 205deg,rgba(255,255,255,0) 235deg)}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

.k-col>*{flex-shrink:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:linear-gradient(180deg,{{tint}} 0%,#121212 68%);background-color:#121212;color:#FFFFFF;font-family:'Noto Sans KR',sans-serif;padding:14px 24px 26px;display:flex;flex-direction:column;gap:22px;overflow:hidden">
  <div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 40%);pointer-events:none"></div>
  <div class="k-col" style="position:relative;display:flex;flex-direction:column;gap:22px;flex-grow:1">
  <div style="display:flex;align-items:center;justify-content:space-between;height:44px">
    <span style="width:32px;display:flex"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span>
    <div style="display:flex;flex-direction:column;align-items:center;line-height:1.35">
      <span style="font-size:11px;color:#E0E0E0">예약 편지에서 재생 중</span>
      <span style="font-size:13px;font-weight:700">지민에게</span>
    </div>
    <span style="width:32px;display:flex;justify-content:flex-end"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.3" fill="#FFFFFF"></circle><circle cx="12" cy="12" r="1.3" fill="#FFFFFF"></circle><circle cx="19" cy="12" r="1.3" fill="#FFFFFF"></circle></svg></span>
  </div>
  <div style="position:relative;width:342px;height:290px;margin-top:4px">
    <div aria-hidden="true" style="position:absolute;left:0;top:0;width:290px;height:290px;border-radius:4px;overflow:hidden;background:{{tint}};box-shadow:0 18px 40px rgba(0,0,0,.45);z-index:2">
      <svg width="100%" height="100%" style="position:absolute;inset:0;opacity:.22;mix-blend-mode:overlay"><filter id="kn290"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#kn290)"></rect></svg>
      <div style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 38%,rgba(0,0,0,0) 60%,rgba(0,0,0,.28) 100%)"></div>
      <div style="position:absolute;inset:0;padding:20px;display:flex;flex-direction:column;justify-content:space-between;color:#FFFFFF">
        <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700;letter-spacing:-0.2px"><span>할 말이 있는데</span><span style="opacity:.8">2027</span></div>
        <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:168px;line-height:.8;letter-spacing:-10px;margin-left:-5px">1.1</span>
        <span style="align-self:flex-end;font-size:14px;font-weight:500;opacity:.85">영진</span>
      </div>
    </div>
    <div aria-hidden="true" style="position:absolute;top:{{vtop}};left:58px;width:276px;height:276px;border-radius:50%;z-index:1;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:left .9s cubic-bezier(.3,0,.2,1)">
      <div class="k-grooves" style="position:absolute;inset:0;border-radius:50%;">
        <div style="position:absolute;left:50%;top:50%;width:99px;height:99px;margin:-49px 0 0 -49px;border-radius:50%;background:{{tint}};display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FFFFFF">
          <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;line-height:1;letter-spacing:-1px">1.1</span>
          <span style="font-size:9px;font-weight:700;margin-top:2px;opacity:.85">SIDE A</span>
          <div style="position:absolute;width:6px;height:6px;border-radius:50%;background:#121212"></div>
        </div>
      </div>
      <div class="k-sheen" style="position:absolute;inset:0;border-radius:50%;pointer-events:none"></div>
    </div>
  </div>
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
    <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
      <h1 style="margin:0;font-size:22px;font-weight:700;letter-spacing:-0.6px;line-height:1.35">할 말이 있는데 1월 1일에 할게</h1>
      <span style="font-size:15px;color:#B3B3B3">영진</span>
    </div>
    <span style="flex-shrink:0;padding-top:3px"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></span>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <div role="img" aria-label="아직 재생 전" style="height:4px;background:rgba(255,255,255,.25);border-radius:2px;position:relative">
      <div style="position:absolute;left:-2px;top:-4px;width:12px;height:12px;border-radius:50%;background:#FFFFFF"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#B3B3B3"><span>오늘</span><span>-50일 12시간</span></div>
  </div>
  <div aria-hidden="true" style="display:flex;align-items:center;justify-content:space-between;padding:0 4px">
    <span style="opacity:.6"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B3B3B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg></span><span style="opacity:.35"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20L9 12l10-8z" fill="#FFFFFF"></path><path d="M5 19V5"></path></svg></span>
    <span style="width:66px;height:66px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span>
    <span style="opacity:.35"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8z" fill="#FFFFFF"></path><path d="M19 5v14"></path></svg></span><span style="opacity:.6"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B3B3B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V10a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3"></path></svg></span>
  </div>
  <p style="flex-shrink:1;margin:auto 0 0;font-size:14px;line-height:1.6;color:#D0D0D0;text-align:center">1월 1일 0시에 재생돼요.<br>그 전에는 누구도 열 수 없어요.</p>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
    <button style="height:52px;border:1px solid rgba(255,255,255,.5);border-radius:26px;background:transparent;color:#FFFFFF;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer">캘린더에 저장</button>
    <a href="Main.dc.html" style="height:52px;border-radius:26px;background:#FFFFFF;color:#121212;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none">나도 예약 편지 쓰기</a>
  </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tint": {"editor": "color", "default": "#3A5BD9", "options": ["#3A5BD9", "#E0552B", "#0F8A6A", "#C93A78"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() { return { tint: this.props.tint ?? '#3A5BD9', vtop: '6px' }; }
}
</script>
</body>
</html>
