<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>플레이어 — 아직 잠긴 편지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#000000}a:hover{color:#000000}
a:focus-visible,button:focus-visible{outline:3px solid #000000;outline-offset:3px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;color:#000000;font-family:'Noto Sans KR',sans-serif;padding:32px 28px 26px;display:flex;flex-direction:column;gap:22px">
  <p style="margin:0;font-size:14px;font-weight:500;text-align:center;color:#5C5C5C">지민에게 온 예약 편지</p>

  <div style="width:334px;height:334px;box-sizing:border-box;border-radius:10px;background:{{tint}};color:#FFFFFF;padding:22px;display:flex;flex-direction:column;justify-content:space-between">
    <span style="font-size:24px;font-weight:700;letter-spacing:-0.5px">2027</span>
    <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:170px;line-height:0.85;letter-spacing:-8px;margin-left:-6px">1.1</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:4px">
    <h1 style="margin:0;font-size:22px;font-weight:900;letter-spacing:-0.8px;line-height:1.35">할 말이 있는데 1월 1일에 할게</h1>
    <span style="font-size:15px;color:#5C5C5C">영진</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <div role="img" aria-label="아직 재생 전" style="height:4px;background:#E2E2E2;border-radius:2px;position:relative">
      <div style="position:absolute;left:0;top:-5px;width:14px;height:14px;border-radius:50%;background:#000000"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#5C5C5C">
      <span>오늘</span>
      <span>-50일 12시간</span>
    </div>
  </div>

  <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
    <div aria-hidden="true" style="width:68px;height:68px;border-radius:50%;background:#000000;display:flex;align-items:center;justify-content:center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
    </div>
    <span style="font-size:14px;font-weight:500;text-align:center;line-height:1.6">1월 1일 0시부터 열 수 있어요.<br>그 전엔 보낸 사람도 못 열어요.</span>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
    <button style="height:54px;border:1px solid #BDBDBD;border-radius:27px;background:#FFFFFF;color:#000000;font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;cursor:pointer">캘린더에 저장</button>
    <a href="Main.dc.html" style="height:54px;border-radius:27px;background:#000000;color:#FFFFFF;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none">나도 예약 편지 쓰기</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tint":{"editor":"color","default":"#2F6BFF","options":["#2F6BFF","#FF5A1F","#12A150","#FF3D8B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { tint: this.props.tint ?? '#2F6BFF' }; }
}
</script>
</body>
</html>
