<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>항공 봉투 — 아직 잠긴 편지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}
a{color:#1F3C88}a:hover{color:#152A61}
a:focus-visible,button:focus-visible{outline:3px solid #1F3C88;outline-offset:3px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#EEF1F5;color:#1F3C88;font-family:'Gowun Dodum',sans-serif;padding:36px 26px 28px;display:flex;flex-direction:column;gap:24px">
  <h1 style="margin:0;font-size:26px;font-weight:400;line-height:1.5;letter-spacing:-0.5px">편지가 도착했어요.<br>1월 1일 0시에 열립니다.</h1>

  <div style="flex-grow:1;display:flex;align-items:center;justify-content:center">
    <div style="width:330px;height:226px;box-sizing:border-box;padding:11px;transform:rotate(-3deg);background-image:repeating-linear-gradient(135deg,#D7263D 0,#D7263D 14px,#FFFFFF 14px,#FFFFFF 28px,#1F3C88 28px,#1F3C88 42px,#FFFFFF 42px,#FFFFFF 56px);box-shadow:0 14px 28px rgba(31,60,136,0.16)">
      <div style="width:100%;height:100%;box-sizing:border-box;background:#FFFFFF;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <span style="font-size:13px;line-height:1.5">보내는 사람<br>영진</span>
          <div style="width:58px;height:68px;box-sizing:border-box;border:2px dotted #D7263D;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#D7263D;line-height:1.1">
            <span style="font-size:11px">2027</span>
            <span style="font-size:26px">1.1</span>
          </div>
        </div>
        <span style="font-size:34px;letter-spacing:-0.5px;text-align:center">지민에게</span>
        <span style="font-size:12px;text-align:right;color:#D7263D">2027년 1월 1일 0시 전 개봉 불가</span>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:6px">
    <span style="font-size:15px">열리기까지</span>
    <span style="font-size:40px;letter-spacing:-1px;line-height:1.1">50일 13시간</span>
    <p style="margin:4px 0 0;font-size:14px;line-height:1.65;color:#3B4A6B">그 전에는 쓴 사람도, 이 사이트도 열 수 없어요.</p>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
    <button style="height:54px;border:1.5px solid #1F3C88;border-radius:8px;background:transparent;color:#1F3C88;font-family:'Gowun Dodum',sans-serif;font-size:16px;cursor:pointer">캘린더에 넣기</button>
    <a href="Main.dc.html" style="height:54px;border-radius:8px;background:#1F3C88;color:#FFFFFF;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none">나도 한 통 쓰기</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
