<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>문자 메시지 — 열린 편지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6BF2}a:hover{color:#084FB5}
a:focus-visible,button:focus-visible{outline:3px solid #0B6BF2;outline-offset:3px}
@keyframes lPop{from{opacity:0;transform:translateY(8px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes lDot{0%,60%,100%{opacity:0.35}30%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;color:#000000;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;display:flex;flex-direction:column">
  <div style="display:flex;flex-direction:column;align-items:center;gap:5px;padding:18px 16px 10px;background:#F6F6F6;border-bottom:1px solid #E2E2E2">
    <div aria-hidden="true" style="width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,#A9AEBA 0%,#858A96 100%);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:500">영</div>
    <span style="font-size:13px">영진</span>
  </div>

  <div style="flex-grow:1;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;gap:4px;overflow:hidden">
    <span style="align-self:center;font-size:12px;color:#6D6D72;margin-bottom:8px">2026년 11월 11일 오전 11:18</span>
    <div style="align-self:flex-start;max-width:290px;background:#E9E9EB;border-radius:22px 22px 22px 7px;padding:12px 16px;font-size:23px;font-weight:800;line-height:1.3;letter-spacing:-0.8px">할 말이 있는데<br>1월 1일에 할게</div>

    <span style="align-self:center;font-size:12px;color:#6D6D72;margin:18px 0 8px">2027년 1월 1일 오전 12:00</span>

    <sc-for list="{{msgs}}" as="m" hint-placeholder-count="3">
      <div style="align-self:flex-start;max-width:290px;background:#E9E9EB;border-radius:20px;padding:9px 14px;font-size:16px;line-height:1.4;animation:lPop 0.24s ease-out both">{{m.text}}</div>
    </sc-for>

    <sc-if value="{{typing}}" hint-placeholder-val="{{false}}">
      <div role="img" aria-label="입력 중" style="align-self:flex-start;position:relative;background:#E9E9EB;border-radius:20px;padding:14px 16px;display:flex;gap:5px;align-items:center;margin:2px 0 6px 6px;animation:lPop 0.2s ease-out both">
        <div style="position:absolute;left:-3px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:#E9E9EB"></div>
        <div style="position:absolute;left:-10px;bottom:-8px;width:6px;height:6px;border-radius:50%;background:#E9E9EB"></div>
        <div style="width:9px;height:9px;border-radius:50%;background:#6D6D72;animation:lDot 1.1s infinite"></div>
        <div style="width:9px;height:9px;border-radius:50%;background:#6D6D72;animation:lDot 1.1s 0.18s infinite"></div>
        <div style="width:9px;height:9px;border-radius:50%;background:#6D6D72;animation:lDot 1.1s 0.36s infinite"></div>
      </div>
    </sc-if>
  </div>

  <div style="padding:12px 16px 20px;min-height:50px;display:flex;flex-direction:column;justify-content:flex-end;border-top:1px solid #EFEFEF">
    <sc-if value="{{playing}}" hint-placeholder-val="{{false}}">
      <button onClick="{{showAll}}" style="height:50px;border:1px solid #C7C7CC;border-radius:25px;background:#FFFFFF;color:#0B6BF2;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer">한 번에 보기</button>
    </sc-if>
    <sc-if value="{{done}}" hint-placeholder-val="{{true}}">
      <div style="display:flex;gap:8px;align-items:center">
        <a href="Main.dc.html" style="flex-grow:1;height:50px;border-radius:25px;background:#0B6BF2;color:#FFFFFF;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none">답장도 예약해서 보내기</a>
        <button onClick="{{replay}}" aria-label="다시 보기" style="width:50px;height:50px;border:1px solid #C7C7CC;border-radius:50%;background:#FFFFFF;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B6BF2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
        </button>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var L_LINES = [
  '지민아, 이걸 쓰는 지금은 11월이야',
  '너는 이직할지 말지 아직 고민 중이고',
  '나는 네가 결국 옮길 거라는 데 만 원 걸었어',
  '맞았으면 오늘 밥은 네가 사',
  '틀렸으면, 그것도 잘한 결정이었을 거야',
  '새해 복 많이 받아'
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { shown: 0, typing: false };
    this.timer = null;
  }
  componentDidMount() {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { this.setState({ shown: L_LINES.length, typing: false }); return; }
    this.play();
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  play() {
    clearTimeout(this.timer);
    this.setState({ shown: 0, typing: false });
    this.timer = setTimeout(() => this.step(0), 600);
  }
  step(i) {
    if (i >= L_LINES.length) { this.setState({ typing: false }); return; }
    this.setState({ typing: true });
    var wait = Math.min(1800, 500 + L_LINES[i].length * 45);
    this.timer = setTimeout(() => {
      this.setState({ shown: i + 1, typing: false });
      this.timer = setTimeout(() => this.step(i + 1), 350);
    }, wait);
  }
  renderVals() {
    var n = this.state.shown;
    var done = n >= L_LINES.length;
    return {
      msgs: L_LINES.slice(0, n).map((t) => ({ text: t })),
      typing: this.state.typing,
      done: done,
      playing: !done,
      showAll: () => { clearTimeout(this.timer); this.setState({ shown: L_LINES.length, typing: false }); },
      replay: () => this.play()
    };
  }
}
</script>
</body>
</html>
