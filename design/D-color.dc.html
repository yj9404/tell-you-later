<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>색 한 장 — 아직 잠긴 편지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
a:focus-visible,button:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:{{tint}};color:#FFFFFF;font-family:'Noto Sans KR',sans-serif;padding:32px 28px 28px;display:flex;flex-direction:column">
  <p style="margin:0;font-size:16px;font-weight:500;line-height:1.5">영진이 지민에게 쓴 편지</p>

  <div style="flex-grow:1;display:flex;flex-direction:column;justify-content:center;gap:6px">
    <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:44px;line-height:1;letter-spacing:-1px">2027</span>
    <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:216px;line-height:0.82;letter-spacing:-10px;margin-left:-8px">1.1</span>
    <h1 style="margin:18px 0 0;font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1.3">0시에 열립니다</h1>
    <p style="margin:6px 0 0;font-size:15px;line-height:1.65;max-width:300px">그 전에는 쓴 사람도, 이 사이트도 열 수 없습니다.</p>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #FFFFFF;padding-top:14px">
      <span style="font-size:15px;font-weight:500">남은 시간</span>
      <span style="font-size:22px;font-weight:900;letter-spacing:-0.5px">50일 13시간</span>
    </div>
    <a href="Main.dc.html" style="height:58px;border-radius:29px;background:#FFFFFF;color:{{tint}};font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none">나도 한 통 쓰기</a>
    <button style="height:48px;border:0;background:transparent;color:#FFFFFF;font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:500;text-decoration:underline;text-underline-offset:4px;cursor:pointer">캘린더에 넣어 두기</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tint":{"editor":"color","default":"#0A7A43","options":["#0A7A43","#C2362B","#1D45C8","#1B1B1B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { tint: this.props.tint ?? '#0A7A43' }; }
}
</script>
</body>
</html>
