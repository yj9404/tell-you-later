<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>책 한 권 — 아직 잠긴 편지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.col>*{flex-shrink:0}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
.serif{font-family:"Noto Serif KR",serif}
</style>
</helmet>
<div class="col" style="width:390px;height:844px;box-sizing:border-box;background:#E4E5E7;color:#1A1A1A;font-family:'Noto Sans KR',sans-serif;padding:30px 24px 24px;display:flex;flex-direction:column;gap:24px;overflow:hidden">
  <p style="margin:0;font-size:15px;color:#555555">영진이 지민에게 보낸 책 한 권</p>
  <div style="flex-grow:1;flex-shrink:1;display:flex;align-items:center;justify-content:center"><div aria-hidden="true" style="position:relative;width:280px;height:384px">
    <div aria-hidden="true" style="position:absolute;left:10px;top:6px;width:270px;height:374px;border-radius:2px 5px 5px 2px;background:#F6F4EE;box-shadow:inset -1px 0 0 #D9D5CB"></div>
    <div aria-hidden="true" style="position:absolute;left:5px;top:3px;width:270px;height:379px;border-radius:2px 5px 5px 2px;background:repeating-linear-gradient(90deg,#FBFAF6 0 2px,#E9E5DB 2px 3px)"></div>
    <div style="position:absolute;left:0;top:0;width:270px;height:384px;border-radius:2px 6px 6px 2px;box-shadow:0 2px 3px rgba(0,0,0,.18),0 24px 40px rgba(0,0,0,.2)"><div style="position:absolute;inset:0;border-radius:2px 6px 6px 2px;background:{{tint}};overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden">
        <svg width="100%" height="100%" style="position:absolute;inset:0;opacity:.25;mix-blend-mode:overlay"><filter id="dcloth"><feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#dcloth)"></rect></svg>
        <div style="position:absolute;left:0;top:0;bottom:0;width:22px;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.08) 60%,rgba(0,0,0,.18))"></div>
        <div style="position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.12),rgba(255,255,255,0) 45%,rgba(0,0,0,.15))"></div>
        <div class="serif" style="position:absolute;left:44px;right:24px;top:46px;display:flex;flex-direction:column;gap:14px;color:rgba(255,248,230,.92);text-shadow:0 1px 0 rgba(0,0,0,.35),0 -1px 0 rgba(255,255,255,.12)">
          <span style="font-size:25px;font-weight:700;line-height:1.4;letter-spacing:-0.5px">할 말이 있는데<br>1월 1일에 할게</span>
          <span style="width:28px;height:1px;background:rgba(255,248,230,.7)"></span>
          <span style="font-size:13px">영진 지음</span>
        </div>
        <span class="serif" style="position:absolute;left:44px;bottom:28px;font-size:12px;color:rgba(255,248,230,.92);text-shadow:0 1px 0 rgba(0,0,0,.35),0 -1px 0 rgba(255,255,255,.12);opacity:.85">지민에게</span>
      </div><div style="position:absolute;left:0;right:0;bottom:30px;height:88px;background:#F4F2EC;box-shadow:0 1px 3px rgba(0,0,0,.25);padding:14px 18px 14px 40px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:4px;color:#1A1A1A;">
        <span style="font-size:15px;font-weight:700;letter-spacing:-0.3px">1월 1일 0시에 펼칠 수 있어요</span>
        <span style="font-size:12px;color:#5A5A5A">그 전에는 누구도 열 수 없어요</span>
      </div></div>
  </div></div>
  <div style="display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #C9CBCF;padding-top:14px"><span style="font-size:14px;color:#555555">펼칠 수 있을 때까지</span><span style="font-size:20px;font-weight:700;letter-spacing:-0.4px">50일 13시간</span></div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button  style="height:54px;border:1px solid #B9BBBF;border-radius:27px;background:transparent;color:#1A1A1A;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer">캘린더에 저장</button><a href="Main.dc.html" style="height:54px;border-radius:27px;background:#1A1A1A;color:#FFFFFF;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none">나도 한 권 보내기</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tint": {"editor": "color", "default": "#1F4D3A", "options": ["#1F4D3A", "#8C2A23", "#1F3A73", "#2B2B2B"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() { return { tint: this.props.tint ?? '#1F4D3A' }; }
}
</script>
</body>
</html>
