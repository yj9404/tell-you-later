<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>잠금화면 알림 — 열린 편지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#A35F00}a:hover{color:#7A4700}
a:focus-visible,button:focus-visible{outline:3px solid #000000;outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background-color:{{tint}};background-image:radial-gradient(circle at 15% 12%,rgba(255,255,255,0.38) 0%,rgba(255,255,255,0) 46%),radial-gradient(circle at 92% 48%,rgba(255,110,190,0.50) 0%,rgba(255,110,190,0) 52%),radial-gradient(circle at 25% 98%,rgba(0,0,0,0.50) 0%,rgba(0,0,0,0) 58%),radial-gradient(circle at 80% 100%,rgba(60,220,255,0.35) 0%,rgba(60,220,255,0) 45%);color:#FFFFFF;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">

  <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;bottom:0;box-sizing:border-box;padding:76px 26px 0;opacity:{{homeO}};transform:{{homeT}};transition:opacity 0.5s ease,transform 0.5s ease">
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 0;font-size:11px;text-align:center">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:62px;border-radius:15px;background:#34B34A;display:flex;align-items:center;justify-content:center"><div style="width:32px;height:24px;border-radius:9px;background:#FFFFFF"></div></div><span>메시지</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:62px;border-radius:15px;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#D2232A;line-height:1"><span style="font-size:10px;font-weight:700">금요일</span><span style="font-size:30px;font-weight:500;color:#000000">1</span></div><span>달력</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:62px;border-radius:15px;background:#F2F2F2;display:flex;align-items:center;justify-content:center"><div style="width:28px;height:28px;border-radius:50%;background:#FF9F0A"></div></div><span>사진</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:62px;border-radius:15px;background:#5AC18E;display:flex;align-items:center;justify-content:center"><div style="width:10px;height:44px;border-radius:5px;background:#FFFFFF;transform:rotate(35deg)"></div></div><span>지도</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:62px;border-radius:15px;background:#3D8BFF;display:flex;align-items:center;justify-content:center"><div style="width:26px;height:26px;border-radius:50%;background:#FFE14A"></div></div><span>날씨</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:62px;border-radius:15px;background:#1B1B1B;display:flex;align-items:center;justify-content:center"><div style="width:30px;height:30px;box-sizing:border-box;border-radius:50%;border:3px solid #FFFFFF"></div></div><span>시계</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:62px;border-radius:15px;background:#8E8E93;display:flex;align-items:center;justify-content:center"><div style="width:30px;height:30px;box-sizing:border-box;border-radius:50%;border:6px dotted #FFFFFF"></div></div><span>설정</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:62px;border-radius:15px;background:#FFFFFF;overflow:hidden;display:flex;flex-direction:column"><div style="height:17px;background:#FFD23F"></div><div style="flex-grow:1;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 10px"><div style="height:3px;background:#C9C9C9"></div><div style="height:3px;background:#C9C9C9"></div><div style="height:3px;width:60%;background:#C9C9C9"></div></div></div><span>메모</span></div>
    </div>
  </div>

  <div aria-hidden="{{lockHidden}}" style="position:absolute;left:0;right:0;top:0;bottom:0;box-sizing:border-box;padding:56px 18px 26px;display:flex;flex-direction:column;align-items:center;transform:{{lockT}};opacity:{{lockO}};transition:transform 0.6s cubic-bezier(0.4,0,0.2,1),opacity 0.6s">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V5a4 4 0 0 1 7.5-2"></path></svg>
    <span style="font-size:20px;font-weight:500;margin-top:12px">2027년 1월 1일 금요일</span>
    <span style="font-size:116px;font-weight:700;line-height:1.05;letter-spacing:-3px">0:00</span>
    <div style="align-self:stretch;margin-top:70px;background:rgba(255,255,255,0.24);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:22px;padding:14px;display:flex;gap:12px;align-items:center">
      <div aria-hidden="true" style="width:42px;height:42px;flex-shrink:0;border-radius:11px;background:#000000;display:flex;align-items:center;justify-content:center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:2px;flex-grow:1;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:700">영진</span><span style="font-size:12px">지금</span></div>
        <span style="font-size:15px;line-height:1.4">1월 1일이야. 이제 말할게</span>
      </div>
    </div>
  </div>

  <div aria-hidden="{{noteHidden}}" style="position:absolute;left:0;right:0;top:0;bottom:0;box-sizing:border-box;background:#FFFFFF;color:#000000;padding:22px 22px 24px;display:flex;flex-direction:column;gap:14px;transform-origin:333px 215px;transform:{{noteT}};opacity:{{noteO}};border-radius:{{noteR}};transition:transform 0.45s cubic-bezier(0.3,0.9,0.3,1),opacity 0.25s,border-radius 0.45s">
    <div style="display:flex;align-items:center;gap:4px;color:#A35F00;font-size:16px;font-weight:500">
      <svg aria-hidden="true" width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#A35F00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"></path></svg>
      <span>메모</span>
    </div>
    <span style="align-self:center;font-size:12px;color:#6D6D72">2027년 1월 1일 오전 12:00</span>
    <h1 style="margin:0;font-size:27px;font-weight:800;letter-spacing:-0.8px">지민에게</h1>
    <p style="margin:0;font-size:17px;line-height:1.8;white-space:pre-line">지민아, 이걸 쓰는 지금은 11월이야.
너는 이직할지 말지 아직 고민 중이고, 나는 네가 결국 옮길 거라는 데 만 원 걸었어.
맞았으면 오늘 밥은 네가 사.
틀렸으면, 그것도 잘한 결정이었을 거야.
새해 복 많이 받아.</p>
    <span style="font-size:15px;color:#6D6D72">영진, 2026년 11월 11일에 씀</span>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:auto">
      <button onClick="{{replay}}" style="height:54px;border:1px solid #BDBDBD;border-radius:27px;background:#FFFFFF;color:#000000;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer">다시 보기</button>
      <a href="Main.dc.html" style="height:54px;border-radius:27px;background:#000000;color:#FFFFFF;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none">나도 예약 편지 쓰기</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tint":{"editor":"color","default":"#2447D6","options":["#2447D6","#C9245F","#0F7A45","#1B1B1B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'lock' };
    this.timers = [];
  }
  componentDidMount() {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { this.setState({ phase: 'note' }); return; }
    this.play();
  }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  play() {
    this.timers.forEach(clearTimeout);
    this.setState({ phase: 'lock' });
    this.timers = [
      setTimeout(() => this.setState({ phase: 'home' }), 1400),
      setTimeout(() => this.setState({ phase: 'note' }), 2700)
    ];
  }
  renderVals() {
    var p = this.state.phase;
    return {
      tint: this.props.tint ?? '#2447D6',
      lockT: p === 'lock' ? 'none' : 'translateY(-100%)',
      lockO: p === 'lock' ? '1' : '0',
      lockHidden: p === 'lock' ? 'false' : 'true',
      homeO: p === 'lock' ? '0' : '1',
      homeT: p === 'lock' ? 'scale(0.92)' : 'none',
      noteT: p === 'note' ? 'none' : 'scale(0.16)',
      noteO: p === 'note' ? '1' : '0',
      noteR: p === 'note' ? '0px' : '90px',
      noteHidden: p === 'note' ? 'false' : 'true',
      replay: () => this.play()
    };
  }
}
</script>
</body>
</html>
