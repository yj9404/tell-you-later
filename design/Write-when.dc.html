<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>할 말이 있는데 나중에 할게 — 날짜와 시각 고르기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#000000}a:hover{color:#000000}
input{font-family:inherit}
input:focus{outline:3px solid #000000;outline-offset:2px}
a:focus-visible,button:focus-visible{outline:3px solid #000000;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:640px;box-sizing:border-box;background:#5E5E5E;font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;display:flex;flex-direction:column;justify-content:flex-end">
  <div style="background:#FFFFFF;color:#000000;border-radius:26px 26px 0 0;padding:12px 22px 26px;display:flex;flex-direction:column;gap:20px">
    <div aria-hidden="true" style="align-self:center;width:40px;height:5px;border-radius:3px;background:#CFCFCF"></div>

    <h2 style="margin:0;font-size:26px;font-weight:900;letter-spacing:-1px">언제 할까요</h2>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <button aria-pressed="false" style="height:64px;border:2px solid #000000;border-radius:16px;background:#FFFFFF;color:#000000;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 14px;gap:2px"><span style="font-size:16px;font-weight:900">새해 0시</span><span style="font-size:12px;color:#555555">2027년 1월 1일</span></button>
      <button aria-pressed="false" style="height:64px;border:2px solid #000000;border-radius:16px;background:#FFFFFF;color:#000000;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 14px;gap:2px"><span style="font-size:16px;font-weight:900">1년 뒤 지금</span><span style="font-size:12px;color:#555555">2027년 11월 11일 오후 5:04</span></button>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font-size:14px;font-weight:700">아니면 직접</span>
      <button style="height:56px;border:0;border-radius:14px;background:#FFE94A;color:#000000;font-family:inherit;font-size:19px;font-weight:900;letter-spacing:-0.5px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer">
        <span>2026년 11월 12일 목요일</span>
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      </button>

      <div style="display:flex;align-items:center;gap:10px">
        <div role="group" aria-label="오전 오후" style="display:flex;border:2px solid #000000;border-radius:14px;overflow:hidden;height:56px">
          <button aria-pressed="true" style="width:58px;border:0;background:#000000;color:#FFFFFF;font-family:inherit;font-size:16px;font-weight:900;cursor:pointer">오전</button>
          <button aria-pressed="false" style="width:58px;border:0;background:#FFFFFF;color:#000000;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer">오후</button>
        </div>
        <input aria-label="시" inputMode="numeric" value="12" style="width:72px;height:56px;box-sizing:border-box;border:0;border-radius:14px;background:#FFE94A;color:#000000;font-size:28px;font-weight:900;text-align:center">
        <span style="font-size:28px;font-weight:900">:</span>
        <input aria-label="분" inputMode="numeric" value="00" style="width:72px;height:56px;box-sizing:border-box;border:0;border-radius:14px;background:#FFE94A;color:#000000;font-size:28px;font-weight:900;text-align:center">
      </div>
      <span style="font-size:13px;color:#555555">숫자를 눌러 바로 입력하세요.</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font-size:15px;font-weight:700">2026년 11월 12일 목요일 0시에 열립니다.</span>
      <button style="height:60px;border:0;border-radius:30px;background:#000000;color:#FFFFFF;font-family:inherit;font-size:18px;font-weight:900;cursor:pointer">이때로 정하기</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":640}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
