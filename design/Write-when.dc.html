<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>할 말이 있는데 나중에 할게 — 여는 날 고르기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
input{font-family:inherit}
input:focus{outline:2px solid #111111;outline-offset:0}
button:focus-visible{outline:2px solid #111111;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:660px;box-sizing:border-box;background:rgba(0,0,0,0.45);font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;display:flex;flex-direction:column;justify-content:flex-end">
  <div style="background:#FFFFFF;color:#111111;border-radius:22px 22px 0 0;padding:10px 20px 24px;display:flex;flex-direction:column;gap:18px">
    <div aria-hidden="true" style="align-self:center;width:36px;height:4px;border-radius:2px;background:#D6D6D6"></div>
    <h2 style="margin:0;font-size:20px;font-weight:700;letter-spacing:-0.5px">언제 열리게 할까요</h2>

    <div role="radiogroup" style="border:1px solid #DCDCDC;border-radius:14px;overflow:hidden">
      <button role="radio" aria-checked="false" style="display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:0 16px;border:0;border-bottom:1px solid #EDEDED;background:#FFFFFF;font-family:inherit;text-align:left;cursor:pointer"><span aria-hidden="true" style="width:20px;height:20px;box-sizing:border-box;border-radius:50%;border:1.5px solid #C4C4C4;flex-shrink:0"></span><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:600;color:#111111">새해 0시</span><span style="font-size:13px;color:#6B6B6B">2027년 1월 1일 금요일 오전 0:00</span></span></button>
      <button role="radio" aria-checked="false" style="display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:0 16px;border:0;border-bottom:1px solid #EDEDED;background:#FFFFFF;font-family:inherit;text-align:left;cursor:pointer"><span aria-hidden="true" style="width:20px;height:20px;box-sizing:border-box;border-radius:50%;border:1.5px solid #C4C4C4;flex-shrink:0"></span><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:600;color:#111111">1년 뒤 지금</span><span style="font-size:13px;color:#6B6B6B">2027년 11월 12일 금요일 오후 1:44</span></span></button>
      <div style="padding:0 0 16px">
        <button role="radio" aria-checked="true" style="display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:0 16px;border:0;border-bottom:1px solid #EDEDED;background:#FFFFFF;font-family:inherit;text-align:left;cursor:pointer;border-bottom:0"><span aria-hidden="true" style="width:20px;height:20px;box-sizing:border-box;border-radius:50%;border:6px solid #111111;flex-shrink:0"></span><span style="font-size:16px;font-weight:600;color:#111111">직접 고르기</span></button>
        <div style="display:flex;flex-direction:column;gap:8px;padding:0 16px 0 48px">
          <button style="height:52px;border-radius:12px;background:#F2F2F3;display:flex;align-items:center;border:0;padding:0 14px;justify-content:space-between;font-family:inherit;font-size:16px;color:#111111;cursor:pointer">
            <span>2027년 1월 1일 금요일</span>
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
          </button>
          <div style="display:flex;gap:8px;align-items:center">
            <div role="group" aria-label="오전 오후" style="height:52px;border-radius:12px;background:#F2F2F3;display:flex;align-items:center;padding:4px;box-sizing:border-box">
              <button aria-pressed="true" style="height:44px;width:52px;border:0;border-radius:9px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,0.12);color:#111111;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer">오전</button>
              <button aria-pressed="false" style="height:44px;width:52px;border:0;border-radius:9px;background:transparent;color:#6B6B6B;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer">오후</button>
            </div>
            <input aria-label="시" inputMode="numeric" value="12" style="width:52px;height:52px;box-sizing:border-box;border:0;border-radius:12px;background:#F2F2F3;color:#111111;font-size:18px;font-weight:600;text-align:center">
            <span style="font-size:18px;color:#9A9A9A">:</span>
            <input aria-label="분" inputMode="numeric" value="00" style="width:52px;height:52px;box-sizing:border-box;border:0;border-radius:12px;background:#F2F2F3;color:#111111;font-size:18px;font-weight:600;text-align:center">
          </div>
        </div>
      </div>
    </div>

    <p style="margin:0;font-size:14px;color:#555555">2027년 1월 1일 금요일 오전 0:00에 열려요. 앞으로 50일 남았어요.</p>
    <button style="height:56px;border:0;border-radius:14px;background:#111111;color:#FFFFFF;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer">이때로 정하기</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":660}}'>

  renderVals() { return {}; }

</body>
</html>
