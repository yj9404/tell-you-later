<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>플레이어 — 열린 편지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#000000}a:hover{color:#000000}
a:focus-visible,button:focus-visible{outline:3px solid #000000;outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FFFFFF;color:#000000;font-family:'Noto Sans KR',sans-serif;padding:28px 28px 26px;display:flex;flex-direction:column;gap:20px">
  <div style="display:flex;align-items:center;gap:14px">
    <div aria-hidden="true" style="width:76px;height:76px;flex-shrink:0;border-radius:8px;background:{{tint}};color:#FFFFFF;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:36px;line-height:0.9;letter-spacing:-2px">1.1</div>
    <div style="display:flex;flex-direction:column;gap:3px;min-width:0">
      <h1 style="margin:0;font-size:17px;font-weight:900;letter-spacing:-0.5px;line-height:1.35">할 말이 있는데 1월 1일에 할게</h1>
      <span style="font-size:14px;color:#5C5C5C">영진</span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <div role="img" aria-label="재생 진행" style="height:4px;background:#E2E2E2;border-radius:2px">
      <div style="height:4px;width:{{pct}};background:#000000;border-radius:2px;transition:width 1.7s linear"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#5C5C5C">
      <span>2027년 1월 1일 0:00</span>
      <span>{{count}}</span>
    </div>
  </div>

  <div style="flex-grow:1;overflow:hidden;position:relative">
    <div style="transform:{{shift}};transition:transform 0.6s cubic-bezier(0.3,0,0.2,1)">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="5">
        <div style="height:72px;display:flex;align-items:center;font-size:23px;font-weight:900;letter-spacing:-1px;line-height:1.3;color:{{l.color}};transition:color 0.4s">{{l.text}}</div>
      </sc-for>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
    <button onClick="{{replay}}" style="height:54px;border:1px solid #BDBDBD;border-radius:27px;background:#FFFFFF;color:#000000;font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:700;cursor:pointer">처음부터 듣기</button>
    <a href="Main.dc.html" style="height:54px;border-radius:27px;background:#000000;color:#FFFFFF;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none">나도 예약 편지 쓰기</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tint":{"editor":"color","default":"#2F6BFF","options":["#2F6BFF","#FF5A1F","#12A150","#FF3D8B"]},"$preview":{"width":390,"height":844}}'>
var K_LINES = [
  '지민아,',
  '이걸 쓰는 지금은 11월이야',
  '너는 이직할지 말지 아직 고민 중이고',
  '나는 네가 결국 옮길 거라는 데 만 원 걸었어',
  '맞았으면 오늘 밥은 네가 사',
  '틀렸으면, 그것도 잘한 결정이었을 거야',
  '새해 복 많이 받아'
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: -1 };
    this.timer = null;
  }
  componentDidMount() {
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { this.setState({ idx: K_LINES.length }); return; }
    this.play();
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  play() {
    clearTimeout(this.timer);
    this.setState({ idx: -1 });
    this.timer = setTimeout(() => this.step(), 700);
  }
  step() {
    var n = this.state.idx + 1;
    this.setState({ idx: n });
    if (n < K_LINES.length) this.timer = setTimeout(() => this.step(), 1700);
  }
  renderVals() {
    var i = this.state.idx;
    var total = K_LINES.length;
    var done = i >= total;
    var row = done ? 0 : Math.max(0, i - 1);
    var cur = Math.min(Math.max(i + 1, 0), total);
    return {
      tint: this.props.tint ?? '#2F6BFF',
      lines: K_LINES.map((t, k) => ({ text: t, color: (done || k === i) ? '#000000' : '#8A8A8A' })),
      shift: 'translateY(-' + (row * 72) + 'px)',
      pct: Math.round((cur / total) * 100) + '%',
      count: cur + ' / ' + total,
      replay: () => this.play()
    };
  }
}
</script>
</body>
</html>
