<!doctype html>
<!--
  테마별 OG 이미지(1200×630)의 틀. 카카오톡에서는 폭 300px 정도로 줄어 보이므로 테마가 한눈에 구분되게 짠다.
  - 바탕: 테마 대표색(scripts/themes.json의 og.bg). 어두운 바탕이면 왼쪽 글자를 흰색으로.
  - 왼쪽: design/og.svg의 로고(부제 제외)를 60% 크기로, 그 아래 "{테마 이름}으로/로 도착"을 크게.
  - 오른쪽 60%: frame.html이 그린 잠김 화면(390×844, 2배율) 캡처를 약 1.05배로 키워 휴대폰 모양에 넣고
    -4도 기울인다. 화면 높이가 이미지보다 커서 위쪽부터 보이고 아래는 잘린다.
  scripts/make-og-image.mjs가 이 페이지를 열고 compose(캡처, 테마)를 부른 뒤 찍는다.
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@900&display=swap" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body { background: var(--bg, #fff); color: var(--ink, #111); font-family: 'Noto Sans KR', sans-serif; }
      .left { position: absolute; left: 68px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; gap: 40px; }
      .logo { display: block; }
      .label { margin: 0; font-size: 80px; font-weight: 900; line-height: 1.12; letter-spacing: -0.03em; white-space: nowrap; }
      canvas { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="logo" id="logo"></div>
      <p class="label" id="label"></p>
    </div>
    <canvas id="phone" width="1200" height="630"></canvas>
    <script>
      // 화면 390×844를 408×882로(이미지 높이 630의 1.4배). 테두리 12px.
      const SCREEN = { w: 408, h: 882, r: 46 }
      const BEZEL = 12
      // 기울이기 전 휴대폰 왼쪽 위 모서리. 휴대폰 위쪽 가운데를 축으로 -4도 돌린다.
      const PHONE = { x: 668, y: 58, angle: (-4 * Math.PI) / 180 }

      // 바탕색이 어두운지(상대 휘도). 어두우면 글자를 흰색으로.
      function isDark(hex) {
        const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
        return 0.2126 * r + 0.7152 * g + 0.0722 * b < 0.35
      }

      // og.svg에서 바탕과 부제를 빼고 제목 부분만 잘라 60% 크기로 넣는다. 제목 글자색은 바탕에 맞춘다.
      async function placeLogo() {
        const svg = new DOMParser().parseFromString(await (await fetch('/design/og.svg')).text(), 'image/svg+xml').documentElement
        svg.querySelector('rect:not([rx])').remove()
        svg.querySelector('path[fill="#6B6B6B"]').remove()
        svg.querySelector('path[fill="#111111"]').setAttribute('fill', 'currentColor')
        const box = document.getElementById('logo')
        box.appendChild(document.importNode(svg, true))
        const el = box.firstChild
        const b = el.getBBox()
        el.setAttribute('viewBox', `${b.x} ${b.y} ${b.width} ${b.height}`)
        el.setAttribute('width', (b.width * 0.6).toFixed(1))
        el.setAttribute('height', (b.height * 0.6).toFixed(1))
      }

      // 휴대폰은 캔버스(소프트웨어 래스터)에 직접 그린다. <img>를 CSS로 줄이거나 돌리면 실행마다 가장자리 픽셀이 조금씩 달라진다.
      async function drawPhone(src) {
        const img = new Image()
        img.src = src
        await img.decode()
        const ctx = document.getElementById('phone').getContext('2d')
        const W = SCREEN.w + BEZEL * 2
        const H = SCREEN.h + BEZEL * 2
        ctx.translate(PHONE.x + W / 2, PHONE.y)
        ctx.rotate(PHONE.angle)
        ctx.translate(-W / 2, 0)
        ctx.save()
        ctx.shadowColor = 'rgba(0, 0, 0, 0.22)'
        ctx.shadowBlur = 48
        ctx.shadowOffsetY = 20
        ctx.fillStyle = '#141414'
        ctx.beginPath()
        ctx.roundRect(0, 0, W, H, SCREEN.r + BEZEL)
        ctx.fill()
        ctx.restore()
        ctx.beginPath()
        ctx.roundRect(BEZEL, BEZEL, SCREEN.w, SCREEN.h, SCREEN.r)
        ctx.clip()
        ctx.imageSmoothingEnabled = true
        ctx.imageSmoothingQuality = 'high'
        ctx.drawImage(img, BEZEL, BEZEL, SCREEN.w, SCREEN.h)
      }

      async function compose(src, { bg, label }) {
        document.body.style.setProperty('--bg', bg)
        document.body.style.setProperty('--ink', isDark(bg) ? '#FFFFFF' : '#111111')
        // "결재 공문으로 도착" → "결재 공문으로" / "도착" 두 줄
        const cut = label.lastIndexOf(' ')
        const el = document.getElementById('label')
        el.append(label.slice(0, cut), document.createElement('br'), label.slice(cut + 1))
        await Promise.all([placeLogo(), drawPhone(src), document.fonts.load('900 80px "Noto Sans KR"', label)])
        await document.fonts.ready
        await new Promise((r) => requestAnimationFrame(r))
      }
    </script>
  </body>
</html>
